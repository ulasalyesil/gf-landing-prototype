<!-- abroad list, item 2 "yurt dışında da harcarken %1 nakit iade kazan".
     Owner-supplied 2026-08-10. A gf-purple (#5d3ebc) disc with white line-work, for
     the LILAC .dpc-abroad__captions panel.
     Carries no % glyph, which AGENTS.md requires here: % is reserved for
     interest/faiz, and the copy's "%1" is cashback. A coin would also have been
     acceptable; a globe is what the owner chose.
     One thing to leave alone: `style="mask-type:alpha"` on the mask is FUNCTIONAL
     (it makes the disc clip the line-work) and must stay, unlike the colour `style`
     attributes, which were stripped here as on the other three so the icon purple
     matches the gf-purple text beside it.
     NOTE: no double hyphens in this comment — writing the token name with its two
     leading dashes is illegal in XML and makes the icon silently render nothing.
     Created by Claude — PUBLIC (ships as a web asset on the public site).
-->
