<!-- sanal kart list, item 1 "ayrı kartlar oluştur". Owner-supplied 2026-08-10.
     White + gf-yellow (#ffd300) accent, so it belongs to the DARK .dpc-sanal__row.
     Figma's `style="fill:...;fill:color(display-p3 ...)"` attributes were stripped:
     Figma emits the sRGB channel values reinterpreted in display-p3, which renders
     MORE saturated than the same hex in sRGB, so the icon would not match the
     gf-yellow / white used elsewhere on the page on a P3 display. Plain hex keeps
     it locked to the tokens.
     Created by Claude — PUBLIC (ships as a web asset on the public site).
-->
